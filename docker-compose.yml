# Local production-like stack: PostgreSQL + MinIO (S3-compatible) + the app.
#   cp .env.docker.example .env.docker   # then fill in the secrets
#   docker compose --env-file .env.docker up --build
# See docs/DEPLOYMENT.md for details.

x-app-env: &app-env
  DATABASE_URL: postgresql://storefront:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/storefront
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${SITE_URL:-http://localhost:3000}
  SITE_URL: ${SITE_URL:-http://localhost:3000}
  STORAGE_DRIVER: s3
  S3_BUCKET: ${S3_BUCKET:-storefront-media}
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_UPLOAD_ENDPOINT: ${S3_PUBLIC_ORIGIN:-http://localhost:9000}
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_ORIGIN:-http://localhost:9000}/${S3_BUCKET:-storefront-media}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: storefront
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront -d storefront"]
      interval: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${SITE_URL:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Creates the bucket and makes it publicly readable (images only; uploads stay presigned).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${S3_BUCKET:-storefront-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set download local/$$BUCKET &&
      mc ilm rule add --expire-days 2 --prefix uploads/ local/$$BUCKET || true"

  # One-shot: applies pending migrations before the app starts.
  migrate:
    build:
      context: .
      target: tools
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  # On-demand helper: seed data, admin bootstrap, cleanup.
  tools:
    build:
      context: .
      target: tools
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  app:
    build:
      context: .
      target: runner
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
